<title>Marmite Doggy Biscuits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one centered column — score bar, sound toggles, square lawn board, touch d-pad. Single look by choice. */
  :root {
    --bg: #13201a;
    --lawn: #9cc96b;
    --lawn-alt: #93c062;
    --blade: #7fae4f;
    --fur: #1b1b1f;
    --fur-edge: #4a4a53;
    --fur-sheen: #2a2a30;
    --beard: #2c2c33;
    --brow: #8a8a94;
    --eye: #3b2414;
    --nose: #050505;
    --biscuit: #dfa65c;
    --biscuit-edge: #9c6a2c;
    --cat-white: #f4f2ee;
    --cat-black: #141416;
    --cat-edge: #8d8d96;
    --cat-eye: #8be05a;
    --cat-nose: #f29bb0;
    --fg: #e6f2ec;
    --muted: #8fb0a3;
    --accent: #dfa65c;
    --btn: #1f3b31;
    --btn-active: #2e5a4a;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    width: min(92vw, 62vh, 480px);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: 0.03em; }
  .scores { display: flex; gap: 16px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .scores b { color: var(--fg); font-weight: 600; }
  .stage { position: relative; width: min(92vw, 62vh, 480px); aspect-ratio: 1; max-width: 100%; }
  canvas {
    width: 100%; height: 100%;
    display: block;
    background: var(--lawn);
    border-radius: 6px;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 16px;
    background: rgba(19, 32, 26, 0.74);
    border-radius: 6px;
    cursor: pointer;
  }
  .overlay h2 { margin: 0; font-size: 1.6rem; text-wrap: balance; }
  .overlay p { margin: 0; color: var(--fg); opacity: 0.85; }
  .overlay .go {
    margin-top: 6px; padding: 10px 22px; border-radius: 6px;
    background: var(--accent); color: #2a1a08; font-weight: 700; font-size: 1.05rem;
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(2, 64px);
    gap: 8px;
    justify-content: center;
  }
  .pad button {
    border: 0; border-radius: 10px;
    background: var(--btn); color: var(--fg);
    font-size: 1.8rem; line-height: 1;
    touch-action: manipulation;
  }
  .pad button:active { background: var(--btn-active); }
  .pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0; text-align: center; }
  .toggles { width: min(92vw, 62vh, 480px); display: flex; gap: 8px; }
  .toggles button {
    flex: 1; border: 0; border-radius: 8px; padding: 8px 10px;
    background: var(--btn); color: var(--muted);
    font: inherit; font-size: 0.9rem; touch-action: manipulation;
  }
  .toggles button[aria-pressed="true"] { color: var(--fg); background: var(--btn-active); }
  .toggles button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-height: 560px) { .pad { display: none; } }
</style>

<header>
  <h1>Marmite Doggy Biscuits</h1>
  <div class="scores">
    <span>Biscuits <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
  </div>
</header>

<div class="toggles">
  <button id="musicBtn" aria-pressed="true">Music: on</button>
  <button id="sfxBtn" aria-pressed="true">Sounds: on</button>
</div>

<div class="stage">
  <canvas id="c" width="800" height="800"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">Marmite Doggy Biscuits</h2>
    <p id="ovMsg">Guide Marmite to the doggy biscuits. Every biscuit makes him longer. Don't let Panda the cat touch him!</p>
    <div class="go" id="ovBtn">Tap to start</div>
  </div>
</div>

<div class="pad" aria-label="Direction controls">
  <button class="up" data-dir="up" aria-label="Up">▲</button>
  <button class="left" data-dir="left" aria-label="Left">◀</button>
  <button class="down" data-dir="down" aria-label="Down">▼</button>
  <button class="right" data-dir="right" aria-label="Right">▶</button>
</div>
<p class="hint">Swipe the lawn, tap the arrows, or use arrow keys / WASD.</p>

<script>
(function () {
  var N = 20;                       // 20 x 20 grid
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var CELL = canvas.width / N;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovMsg = document.getElementById('ovMsg');
  var ovBtn = document.getElementById('ovBtn');

  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var snake, dir, queued, food, score, best = 0, timer, running = false, munchUntil = 0;
  // Panda the cat: grid cell, previous cell (for smooth movement), facing, timing
  var cat = null, catFrom, catDir = [1, 0], catMovedAt = 0, catTimer, catStep = 320;

  try { best = parseInt(localStorage.getItem('snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // ---------- Sound: chiptune music + dog effects, synthesized with Web Audio ----------
  var Sound = (function () {
    var ac = null, master, musicBus, sfxBus, noiseBuf;
    var musicOn = true, sfxOn = true;
    try {
      musicOn = localStorage.getItem('snake-music') !== 'off';
      sfxOn = localStorage.getItem('snake-sfx') !== 'off';
    } catch (e) {}
    var MUSIC_VOL = 0.28, SFX_VOL = 0.5;
    var step = 0, nextTime = 0, tempo = 1, pump = null;

    function init() {
      if (!ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
        musicBus = ac.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(master);
        sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? SFX_VOL : 0; sfxBus.connect(master);
        noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.3), ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
    }

    function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function tone(freq, t, dur, type, vol, dest, slideTo) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.02);
    }

    function noise(t, vol, dest, dur, cutoff) {
      var s = ac.createBufferSource(); s.buffer = noiseBuf;
      var f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = cutoff;
      var g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(dest);
      s.start(t); s.stop(t + dur + 0.02);
    }

    // A small-dog "yip": a fast rising-then-falling buzz through a band-pass filter
    function bark(t, vol) {
      var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(480, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.03);
      o.frequency.exponentialRampToValueAtTime(330, t + 0.15);
      f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 1.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(f); f.connect(g); g.connect(sfxBus);
      o.start(t); o.stop(t + 0.2);
      noise(t, vol * 0.35, sfxBus, 0.06, 1500);
    }

    // A deeper "woof": two buzzy oscillators that swell up then drop, through a low band-pass
    function woof(t, vol) {
      var f = ac.createBiquadFilter(), g = ac.createGain();
      f.type = 'bandpass'; f.frequency.value = 650; f.Q.value = 0.9;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.setValueAtTime(vol, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      f.connect(g); g.connect(sfxBus);
      ['sawtooth', 'square'].forEach(function (type, i) {
        var o = ac.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(190 + i * 3, t);
        o.frequency.exponentialRampToValueAtTime(330 + i * 4, t + 0.05);
        o.frequency.exponentialRampToValueAtTime(150, t + 0.27);
        o.connect(f); o.start(t); o.stop(t + 0.3);
      });
      noise(t, vol * 0.3, sfxBus, 0.08, 500);
    }

    // Cat "meow": a buzzy tone with vibrato whose pitch and vowel rise then fall
    function meow(t, vol) {
      var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      var lfo = ac.createOscillator(), lg = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(550, t);
      o.frequency.linearRampToValueAtTime(850, t + 0.18);
      o.frequency.linearRampToValueAtTime(480, t + 0.6);
      f.type = 'bandpass'; f.Q.value = 3;
      f.frequency.setValueAtTime(900, t);
      f.frequency.linearRampToValueAtTime(1600, t + 0.2);
      f.frequency.linearRampToValueAtTime(800, t + 0.6);
      lfo.frequency.value = 7; lg.gain.value = 12;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.05);
      g.gain.setValueAtTime(vol, t + 0.45);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
      o.connect(f); f.connect(g); g.connect(sfxBus);
      o.start(t); o.stop(t + 0.7); lfo.start(t); lfo.stop(t + 0.7);
    }

    // Am - F - C - G loop, 8 eighth-note steps per bar
    var ROOTS = [45, 41, 48, 43];
    var CHORDS = [[69, 72, 76], [65, 69, 72], [67, 72, 76], [67, 71, 74]];
    var ARP = [0, 1, 2, 1, 0, 2, 1, 2];

    function playStep(t) {
      var bar = Math.floor(step / 8) % 4, s = step % 8, len = 0.16 / tempo;
      if (s % 2 === 0) tone(hz(ROOTS[bar]), t, len * 1.8, 'triangle', 0.5, musicBus);
      tone(hz(CHORDS[bar][ARP[s]]), t, len * 0.9, 'square', 0.12, musicBus);
      if (s % 2 === 1) noise(t, 0.15, musicBus, 0.04, 7000);
      step++;
      return len;
    }

    function pumpLoop() {
      while (nextTime < ac.currentTime + 0.12) nextTime += playStep(nextTime);
    }

    function startMusic() {
      if (!ac) return;
      stopMusic();
      tempo = 1; step = 0;
      nextTime = ac.currentTime + 0.5;
      pump = setInterval(pumpLoop, 30);
    }
    function stopMusic() { clearInterval(pump); pump = null; }
    function setTempo(x) { tempo = x; }

    function seq(notes, start, gap, dur, type, vol) {
      notes.forEach(function (m, i) { tone(hz(m), start + i * gap, dur, type, vol, sfxBus); });
    }

    function sfx(name) {
      if (!ac || !sfxOn) return;
      var t = ac.currentTime;
      if (name === 'eat') {            // WOOF, then crunch crunch
        woof(t, 0.8);
        noise(t + 0.3, 0.35, sfxBus, 0.05, 2500);
        noise(t + 0.38, 0.28, sfxBus, 0.05, 2500);
      } else if (name === 'level') {   // every 5 biscuits: a yip and a jingle
        woof(t, 0.8);
        seq([76, 79, 84, 88], t + 0.3, 0.06, 0.12, 'square', 0.25);
      } else if (name === 'turn') {
        tone(hz(57), t, 0.03, 'triangle', 0.12, sfxBus);
      } else if (name === 'start') {   // "woof woof"
        bark(t, 0.6);
        bark(t + 0.24, 0.6);
      } else if (name === 'meow') {    // Panda joins the chase
        meow(t, 0.45);
      } else if (name === 'caught') {  // Panda got him: meow, then whimper
        meow(t, 0.7);
        tone(1000, t + 0.75, 0.35, 'sine', 0.3, sfxBus, 620);
        tone(900, t + 1.17, 0.55, 'sine', 0.3, sfxBus, 420);
      } else if (name === 'over') {    // sad whimper
        tone(1000, t, 0.35, 'sine', 0.3, sfxBus, 620);
        tone(900, t + 0.42, 0.55, 'sine', 0.3, sfxBus, 420);
      }
    }

    function fade(bus, to) { if (bus) bus.gain.setTargetAtTime(to, ac.currentTime, 0.05); }
    function setMusic(on) {
      musicOn = on; fade(musicBus, on ? MUSIC_VOL : 0);
      try { localStorage.setItem('snake-music', on ? 'on' : 'off'); } catch (e) {}
    }
    function setSfx(on) {
      sfxOn = on; fade(sfxBus, on ? SFX_VOL : 0);
      try { localStorage.setItem('snake-sfx', on ? 'on' : 'off'); } catch (e) {}
    }

    // Silence everything while the tab is in the background
    document.addEventListener('visibilitychange', function () {
      if (!ac) return;
      if (document.hidden) ac.suspend(); else ac.resume();
    });

    return {
      init: init, startMusic: startMusic, stopMusic: stopMusic, setTempo: setTempo, sfx: sfx,
      setMusic: setMusic, setSfx: setSfx,
      musicOn: function () { return musicOn; }, sfxOn: function () { return sfxOn; }
    };
  })();

  var musicBtn = document.getElementById('musicBtn');
  var sfxBtn = document.getElementById('sfxBtn');
  function syncToggles() {
    musicBtn.setAttribute('aria-pressed', String(Sound.musicOn()));
    musicBtn.textContent = 'Music: ' + (Sound.musicOn() ? 'on' : 'off');
    sfxBtn.setAttribute('aria-pressed', String(Sound.sfxOn()));
    sfxBtn.textContent = 'Sounds: ' + (Sound.sfxOn() ? 'on' : 'off');
  }
  musicBtn.addEventListener('click', function () { Sound.init(); Sound.setMusic(!Sound.musicOn()); syncToggles(); });
  sfxBtn.addEventListener('click', function () { Sound.init(); Sound.setSfx(!Sound.sfxOn()); syncToggles(); });
  syncToggles();

  // ---------- Game logic ----------
  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if (cat && cat[0] === x && cat[1] === y) continue;
      if (!snake.some(function (s) { return s[0] === x && s[1] === y; })) free.push([x, y]);
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    cat = [2, 2]; catFrom = cat; catDir = [1, 0]; catMovedAt = 0; catStep = 320;
    snake = [[10, 10], [9, 10], [8, 10]];
    dir = DIRS.right;
    queued = [];
    score = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  function delay() { return Math.max(65, 140 - score * 3); }

  function schedule() { clearTimeout(timer); timer = setTimeout(tick, delay()); }

  function start() {
    reset();
    running = true;
    overlay.hidden = true;
    Sound.init();
    Sound.sfx('start');
    Sound.startMusic();
    schedule();
    clearTimeout(catTimer);
    catTimer = setTimeout(function () { Sound.sfx('meow'); catTick(); }, 1200);   // short head start
  }

  function gameOver(won, byCat) {
    running = false;
    clearTimeout(timer);
    clearTimeout(catTimer);
    Sound.stopMusic();
    Sound.sfx(byCat ? 'caught' : 'over');
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', String(best)); } catch (e) {}
    }
    ovTitle.textContent = byCat ? 'Panda got Marmite!' : won ? 'Good boy!' : 'Ruff luck!';
    ovMsg.textContent = 'Marmite ate ' + score + (score === 1 ? ' biscuit.' : ' biscuits.');
    ovBtn.textContent = 'Tap to play again';
    overlay.hidden = false;
  }

  function turn(name) {
    if (!running) return;
    var d = DIRS[name];
    var last = queued.length ? queued[queued.length - 1] : dir;
    if (d[0] === -last[0] && d[1] === -last[1]) return;   // no reversing
    if (d[0] === last[0] && d[1] === last[1]) return;
    if (queued.length < 2) { queued.push(d); Sound.sfx('turn'); }
  }

  function tick() {
    if (!running) return;
    if (queued.length) dir = queued.shift();
    var head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
    var ate = head[0] === food[0] && head[1] === food[1];
    var body = ate ? snake : snake.slice(0, -1);
    var hit = head[0] < 0 || head[1] < 0 || head[0] >= N || head[1] >= N ||
      body.some(function (s) { return s[0] === head[0] && s[1] === head[1]; });
    if (hit) { gameOver(false); return; }
    if (head[0] === cat[0] && head[1] === cat[1]) { gameOver(false, true); return; }
    snake.unshift(head);
    if (ate) {
      score++; scoreEl.textContent = score;
      munchUntil = performance.now() + 250;
      Sound.sfx(score % 5 === 0 ? 'level' : 'eat');
      Sound.setTempo(Math.min(1.6, 140 / delay()));
      if (snake.length === N * N) { gameOver(true); return; }
      placeFood();
    } else {
      snake.pop();
    }
    schedule();
  }

  // Panda steps one cell toward Marmite's head; now and then he takes a random step
  function catTick() {
    if (!running) return;
    var h = snake[0], opts = [];
    Object.keys(DIRS).forEach(function (k) {
      var m = DIRS[k], nx = cat[0] + m[0], ny = cat[1] + m[1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) return;
      opts.push({ m: m, d: Math.abs(h[0] - nx) + Math.abs(h[1] - ny) + Math.random() * 0.5 });
    });
    opts.sort(function (a, b) { return a.d - b.d; });
    var pick = Math.random() < 0.15 ? opts[Math.floor(Math.random() * opts.length)] : opts[0];
    catFrom = cat;
    cat = [cat[0] + pick.m[0], cat[1] + pick.m[1]];
    catDir = pick.m;
    catMovedAt = performance.now();
    catStep = Math.max(170, 320 - score * 5);
    if (snake.some(function (s) { return s[0] === cat[0] && s[1] === cat[1]; })) { gameOver(false, true); return; }
    catTimer = setTimeout(catTick, catStep);
  }

  // ---------- Drawing ----------
  var rootStyle = getComputedStyle(document.documentElement);
  function tok(name) { return rootStyle.getPropertyValue(name).trim(); }
  var C = {
    lawn: tok('--lawn'), lawnAlt: tok('--lawn-alt'), blade: tok('--blade'),
    fur: tok('--fur'), edge: tok('--fur-edge'), sheen: tok('--fur-sheen'), beard: tok('--beard'),
    brow: tok('--brow'), eye: tok('--eye'), nose: tok('--nose'),
    biscuit: tok('--biscuit'), biscuitEdge: tok('--biscuit-edge'),
    catWhite: tok('--cat-white'), catBlack: tok('--cat-black'), catEdge: tok('--cat-edge'),
    catEye: tok('--cat-eye'), catNose: tok('--cat-nose')
  };

  // Lawn is drawn once to an offscreen canvas
  var bg = document.createElement('canvas');
  bg.width = canvas.width; bg.height = canvas.height;
  (function paintLawn() {
    var b = bg.getContext('2d');
    b.fillStyle = C.lawn; b.fillRect(0, 0, bg.width, bg.height);
    b.fillStyle = C.lawnAlt;
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if ((x + y) % 2 === 0) b.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    b.strokeStyle = C.blade; b.lineWidth = CELL * 0.05; b.lineCap = 'round';
    for (var i = 0; i < 160; i++) {
      var gx = rnd() * bg.width, gy = rnd() * bg.height;
      b.beginPath();
      b.moveTo(gx, gy); b.lineTo(gx - CELL * 0.06, gy - CELL * 0.16);
      b.moveTo(gx + CELL * 0.06, gy); b.lineTo(gx + CELL * 0.1, gy - CELL * 0.14);
      b.stroke();
    }
  })();

  function center(p) { return [p[0] * CELL + CELL / 2, p[1] * CELL + CELL / 2]; }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Direction each segment faces (toward the head)
  function segDir(i) {
    var a = i === 0 ? snake[0] : snake[i - 1], b = i === 0 ? snake[1] : snake[i];
    return [a[0] - b[0], a[1] - b[1]];
  }

  function drawBiscuit(t) {
    var u = CELL, p = center(food), pulse = 1 + Math.sin(t / 220) * 0.06;
    ctx.save();
    ctx.translate(p[0], p[1]);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, u * 0.3, u * 0.36, u * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(-0.5);
    ctx.scale(pulse, pulse);
    function bone(g) {
      ctx.beginPath();
      ctx.rect(-u * 0.27, -u * 0.1 - g, u * 0.54, u * 0.2 + 2 * g);
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(function (k) {
        var cx = k[0] * u * 0.27, cy = k[1] * u * 0.1;
        ctx.moveTo(cx + u * 0.12 + g, cy);
        ctx.arc(cx, cy, u * 0.12 + g, 0, Math.PI * 2);
      });
      ctx.fill();
    }
    ctx.fillStyle = C.biscuitEdge; bone(u * 0.035);
    ctx.fillStyle = C.biscuit; bone(0);
    ctx.fillStyle = C.biscuitEdge;
    [-0.13, 0, 0.13].forEach(function (x) {
      ctx.beginPath(); ctx.arc(x * u, 0, u * 0.025, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function drawBody() {
    var u = CELL, i, p;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    function path() {
      ctx.beginPath();
      p = center(snake[0]); ctx.moveTo(p[0], p[1]);
      for (i = 1; i < snake.length; i++) { p = center(snake[i]); ctx.lineTo(p[0], p[1]); }
    }
    path(); ctx.strokeStyle = C.edge; ctx.lineWidth = u * 0.8; ctx.stroke();
    path(); ctx.strokeStyle = C.fur; ctx.lineWidth = u * 0.7; ctx.stroke();
    path(); ctx.strokeStyle = C.sheen; ctx.lineWidth = u * 0.2; ctx.stroke();
    // wiry fur tufts along both flanks
    ctx.strokeStyle = C.edge; ctx.lineWidth = u * 0.04;
    for (i = 1; i < snake.length; i++) {
      var c = center(snake[i]), d = segDir(i), n = [-d[1], d[0]];
      [-1, 1].forEach(function (s) {
        for (var k = -1; k <= 1; k++) {
          var bx = c[0] + n[0] * s * u * 0.3 + d[0] * k * u * 0.25;
          var by = c[1] + n[1] * s * u * 0.3 + d[1] * k * u * 0.25;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + n[0] * s * u * 0.1 - d[0] * u * 0.08, by + n[1] * s * u * 0.1 - d[1] * u * 0.08);
          ctx.stroke();
        }
      });
    }
  }

  function drawPaws(i, phase) {
    var u = CELL, c = center(snake[i]), d = segDir(i), n = [-d[1], d[0]];
    var ang = Math.atan2(d[1], d[0]);
    [-1, 1].forEach(function (s) {
      var off = phase * s * u * 0.12;
      ctx.beginPath();
      ctx.ellipse(c[0] + n[0] * s * u * 0.42 + d[0] * off, c[1] + n[1] * s * u * 0.42 + d[1] * off,
        u * 0.14, u * 0.09, ang, 0, Math.PI * 2);
      ctx.fillStyle = C.fur; ctx.fill();
      ctx.strokeStyle = C.edge; ctx.lineWidth = u * 0.035; ctx.stroke();
    });
  }

  function drawTail(t) {
    var u = CELL, last = snake[snake.length - 1], prev = snake[snake.length - 2];
    var c = center(last), away = Math.atan2(last[1] - prev[1], last[0] - prev[0]);
    var wag = Math.sin(t / (running ? 70 : 120)) * 0.5;
    ctx.save();
    ctx.translate(c[0], c[1]);
    ctx.rotate(away + wag);
    ctx.beginPath();
    ctx.moveTo(u * 0.15, -u * 0.13);
    ctx.quadraticCurveTo(u * 0.5, -u * 0.1, u * 0.66, 0);
    ctx.quadraticCurveTo(u * 0.5, u * 0.1, u * 0.15, u * 0.13);
    ctx.closePath();
    ctx.fillStyle = C.fur; ctx.fill();
    ctx.strokeStyle = C.edge; ctx.lineWidth = u * 0.035; ctx.stroke();
    ctx.restore();
  }

  // Black miniature schnauzer head, seen from above, facing +x before rotation
  function drawHead(t) {
    var u = CELL, c = center(snake[0]), d = segDir(0);
    var munch = t < munchUntil ? Math.sin((munchUntil - t) / 25) * 0.04 : 0;
    ctx.save();
    ctx.translate(c[0], c[1]);
    ctx.rotate(Math.atan2(d[1], d[0]));
    ctx.scale(1.3, 1.3);
    ctx.lineWidth = u * 0.035; ctx.strokeStyle = C.edge; ctx.lineCap = 'round';

    // folded ears
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.ellipse(-u * 0.12, s * u * 0.37, u * 0.22, u * 0.13, s * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = C.sheen; ctx.fill(); ctx.stroke();
    });

    // bushy beard flaring past the muzzle
    ctx.beginPath();
    ctx.moveTo(u * 0.1, -u * 0.27);
    ctx.lineTo(u * 0.66, -u * (0.3 + munch));
    ctx.lineTo(u * 0.77, -u * 0.12);
    ctx.lineTo(u * 0.8, 0);
    ctx.lineTo(u * 0.77, u * 0.12);
    ctx.lineTo(u * 0.66, u * (0.3 + munch));
    ctx.lineTo(u * 0.1, u * 0.27);
    ctx.closePath();
    ctx.fillStyle = C.beard; ctx.fill(); ctx.stroke();

    // skull and long rectangular muzzle
    rr(-u * 0.42, -u * 0.34, u * 0.66, u * 0.68, u * 0.2);
    ctx.fillStyle = C.fur; ctx.fill(); ctx.stroke();
    rr(u * 0.12, -u * 0.2, u * 0.54, u * 0.4, u * 0.12);
    ctx.fillStyle = C.fur; ctx.fill(); ctx.stroke();

    // whisker strands
    ctx.strokeStyle = C.brow; ctx.lineWidth = u * 0.03;
    [-1, 1].forEach(function (s) {
      for (var k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.moveTo(u * (0.26 + k * 0.12), s * u * 0.17);
        ctx.lineTo(u * (0.31 + k * 0.13), s * u * (0.29 + munch));
        ctx.stroke();
      }
    });

    // eyes
    [-1, 1].forEach(function (s) {
      var ex = 0, ey = s * u * 0.15;
      ctx.fillStyle = '#e8e2d6'; ctx.beginPath(); ctx.arc(ex, ey, u * 0.075, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.eye; ctx.beginPath(); ctx.arc(ex + u * 0.01, ey, u * 0.056, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex + u * 0.03, ey - s * u * 0.015, u * 0.018, 0, Math.PI * 2); ctx.fill();
    });

    // famous schnauzer eyebrows
    ctx.strokeStyle = C.brow; ctx.lineWidth = u * 0.045;
    [-1, 1].forEach(function (s) {
      for (var k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(-u * 0.07, s * u * (0.1 + k * 0.05));
        ctx.lineTo(u * 0.12, s * u * (0.16 + k * 0.06));
        ctx.stroke();
      }
    });

    // nose
    ctx.fillStyle = C.nose;
    ctx.beginPath(); ctx.ellipse(u * 0.66, 0, u * 0.08, u * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(u * 0.68, -u * 0.04, u * 0.025, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // Panda: a black-and-white cat seen from above, facing +x before rotation
  function drawCat(t) {
    var u = CELL, a = center(catFrom), b = center(cat);
    var k = Math.min(1, Math.max(0, (t - catMovedAt) / (catStep * 0.6)));
    k = k * (2 - k);
    var x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k;
    var phase = running && k < 1 ? Math.sin(t / 40) : 0;
    function oval(cx, cy, rx, ry, rot, fill, stroke) {
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot || 0, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
      if (stroke) { ctx.strokeStyle = C.catEdge; ctx.lineWidth = u * 0.035; ctx.stroke(); }
    }
    ctx.save();
    ctx.translate(x, y);
    oval(0, u * 0.14, u * 0.55, u * 0.28, 0, 'rgba(0,0,0,0.15)');
    ctx.rotate(Math.atan2(catDir[1], catDir[0]));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // swishing tail with a white tip
    var sw = Math.sin(t / 220) * 0.35;
    ctx.beginPath();
    ctx.moveTo(-u * 0.5, 0);
    ctx.quadraticCurveTo(-u * 0.8, -sw * u * 0.8, -u * 0.95, sw * u * 0.6);
    ctx.strokeStyle = C.catEdge; ctx.lineWidth = u * 0.17; ctx.stroke();
    ctx.strokeStyle = C.catBlack; ctx.lineWidth = u * 0.12; ctx.stroke();
    oval(-u * 0.95, sw * u * 0.6, u * 0.06, u * 0.06, 0, C.catWhite);

    // white paws
    [[0.12, 1], [0.12, -1], [-0.38, 1], [-0.38, -1]].forEach(function (p, i) {
      var off = (i % 3 === 0 ? 1 : -1) * phase * u * 0.08;
      oval(p[0] * u + off, p[1] * u * 0.27, u * 0.09, u * 0.065, 0, C.catWhite, true);
    });

    // body: white with a black saddle
    oval(-u * 0.15, 0, u * 0.42, u * 0.27, 0, C.catWhite, true);
    oval(-u * 0.22, 0, u * 0.27, u * 0.24, 0, C.catBlack);

    // head
    oval(u * 0.3, 0, u * 0.25, u * 0.25, 0, C.catWhite, true);
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.moveTo(u * 0.16, s * u * 0.13);
      ctx.lineTo(u * 0.24, s * u * 0.37);
      ctx.lineTo(u * 0.38, s * u * 0.18);
      ctx.closePath();
      ctx.fillStyle = C.catBlack; ctx.fill();
      // panda eye patches with green eyes
      oval(u * 0.37, s * u * 0.1, u * 0.085, u * 0.065, s * 0.4, C.catBlack);
      oval(u * 0.39, s * u * 0.1, u * 0.04, u * 0.04, 0, C.catEye);
      oval(u * 0.395, s * u * 0.1, u * 0.012, u * 0.03, 0, C.catBlack);
    });

    // nose and whiskers
    ctx.beginPath();
    ctx.moveTo(u * 0.56, 0); ctx.lineTo(u * 0.5, -u * 0.045); ctx.lineTo(u * 0.5, u * 0.045); ctx.closePath();
    ctx.fillStyle = C.catNose; ctx.fill();
    ctx.strokeStyle = C.catEdge; ctx.lineWidth = u * 0.02;
    [-1, 1].forEach(function (s) {
      for (var w = 0; w < 3; w++) {
        ctx.beginPath();
        ctx.moveTo(u * 0.5, s * u * 0.05);
        ctx.lineTo(u * 0.76, s * u * (0.08 + w * 0.08));
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  function draw(t) {
    ctx.drawImage(bg, 0, 0);
    drawBiscuit(t);
    drawBody();
    var phase = running ? Math.sin(t / 60) : 0;
    drawPaws(snake.length - 1, -phase);
    drawPaws(1, phase);
    drawTail(t);
    drawHead(t);
    drawCat(t);
  }

  function frame(t) {
    draw(t);
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  overlay.addEventListener('click', start);

  Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); turn(b.getAttribute('data-dir')); });
  });

  var sx = 0, sy = 0, tracking = false;
  canvas.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; tracking = true; });
  canvas.addEventListener('pointermove', function (e) {
    if (!tracking) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    sx = e.clientX; sy = e.clientY;
  });
  function endSwipe() { tracking = false; }
  canvas.addEventListener('pointerup', endSwipe);
  canvas.addEventListener('pointercancel', endSwipe);

  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  document.addEventListener('keydown', function (e) {
    var k = KEYS[e.key];
    if (k) { e.preventDefault(); if (!running) start(); turn(k); }
    else if ((e.key === ' ' || e.key === 'Enter') && !running) { e.preventDefault(); start(); }
  });

  // Idle preview behind the start overlay
  reset();
  requestAnimationFrame(frame);
})();
</script>
